<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Profile | Mana Rythu Direct</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body style="background-color: var(--forest-dark); color: var(--white);">

  <header id="main-navbar" class="main-header scrolled">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-badge">🌱</div>
        <div class="brand-titles">
          <span class="brand-name">Mana Rythu</span>
          <span class="brand-tagline">రైతు నుండి మీ ఇంటికి నేరుగా</span>
        </div>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Marketplace</a>
        <a href="farmers.html" class="nav-link">Our Farmers</a>
      </nav>
      <div class="nav-actions">
        <button id="lang-toggle-btn" class="nav-btn"><span>🌐</span> <span>తెలుగు</span></button>
        <button class="nav-btn cart-icon-btn cart-drawer-trigger">
          <span>🧺</span> <span class="badge-counter cart-count-badge">0</span>
        </button>
      </div>
    </div>
  </header>

  <main style="padding-top: 130px; padding-bottom: 80px;">
    <div class="container">
      <div style="margin-bottom: 24px;">
        <a href="farmers.html" style="font-size: 13px; font-weight: 700; color: var(--fresh-light);">← Back to All Farmers</a>
      </div>

      <div id="farmer-detail-container">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <div id="cart-backdrop" class="cart-backdrop"></div>
  <aside id="cart-drawer" class="cart-drawer">
    <div class="cart-drawer-header">
      <h3 style="font-family: var(--font-serif); font-size: 17px; font-weight: 800;">Your Harvest Basket</h3>
      <button id="cart-drawer-close">✕</button>
    </div>
    <div id="cart-drawer-items" class="cart-drawer-items"></div>
    <div id="cart-drawer-summary" class="cart-drawer-summary"></div>
  </aside>

  <script src="js/data.js"></script>
  <script src="js/language.js"></script>
  <script src="js/cart.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("farmer-detail-container");
      const urlParams = new URLSearchParams(window.location.search);
      const farmerId = urlParams.get("id") || "f1";
      const farmer = featuredFarmers.find(f => f.id === farmerId) || featuredFarmers[0];

      function renderFarmerProfile() {
        if (!container || !farmer) return;
        const isTe = window.manaLanguage ? window.manaLanguage.isTelugu : false;
        const name = isTe && farmer.nameTe ? farmer.nameTe : farmer.name;
        const quote = isTe && farmer.quoteTe ? farmer.quoteTe : farmer.quoteEn;
        const crops = isTe && farmer.specialtyCropsTe ? farmer.specialtyCropsTe : farmer.specialtyCrops;

        // Find products belonging to this farmer
        const farmerProducts = productsData.filter(p => p.farmerId === farmer.id);

        container.innerHTML = `
          <div style="background: #123B28; border: 1px solid rgba(255,255,255,0.15); border-radius: 32px; padding: 40px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); margin-bottom: 50px;">
            <div style="display: flex; flex-direction: column; md-flex-row; gap: 30px; align-items: flex-start;">
              <img src="${farmer.image}" alt="${name}" style="width: 140px; height: 140px; border-radius: 28px; object-fit: cover; border: 3px solid var(--harvest); box-shadow: 0 10px 25px rgba(0,0,0,0.5);" />
              <div style="flex: 1;">
                <span class="glass-pill" style="margin-bottom: 10px;">${farmer.badge} • Verified Since ${farmer.verifiedYear}</span>
                <h1 style="font-family: var(--font-serif); font-size: clamp(28px, 4vw, 46px); font-weight: 900; margin: 8px 0;">${name}</h1>
                <p style="font-size: 15px; color: var(--fresh-light); margin-bottom: 16px;">
                  📍 ${farmer.village}, ${farmer.district}, ${farmer.state} • ${farmer.yearsOfFarming} Years Regenerative Soil Heritage
                </p>
                <div style="background: rgba(0,0,0,0.3); border-left: 4px solid var(--fresh); padding: 16px 20px; border-radius: 12px; margin-bottom: 24px;">
                  <p style="font-style: italic; font-size: 15px; line-height: 1.7; color: rgba(255,255,255,0.95);">
                    "${quote}"
                  </p>
                </div>
                <div style="display: flex; gap: 24px; flex-wrap: wrap;">
                  <div><span style="font-size: 12px; color: #AAA;">Farm Method:</span> <strong style="display: block; font-size: 14px; color: #FFF;">${farmer.farmingMethod}</strong></div>
                  <div><span style="font-size: 12px; color: #AAA;">Direct Platform Settlement:</span> <strong style="display: block; font-size: 16px; color: var(--fresh);">${farmer.directEarningsTotal}</strong></div>
                  <div><span style="font-size: 12px; color: #AAA;">Customer Trust Rating:</span> <strong style="display: block; font-size: 16px; color: var(--harvest);">⭐ ${farmer.rating} (${farmer.reviews} reviews)</strong></div>
                </div>
              </div>
            </div>
          </div>

          <h2 style="font-family: var(--font-serif); font-size: 28px; font-weight: 900; margin-bottom: 24px;">
            Fresh Crops from ${name}'s Soil
          </h2>
          <div class="products-grid">
            ${farmerProducts.map(prod => `
              <div class="product-card">
                <div class="product-img-box">
                  <a href="product-detail.html?id=${prod.id}"><img src="${prod.image}" alt="${prod.name}" /></a>
                  <span class="product-badge-tag">${prod.badges[0]}</span>
                </div>
                <div class="product-card-body">
                  <h3 class="product-title">${isTe && prod.nameTe ? prod.nameTe : prod.name}</h3>
                  <div class="product-price-row">
                    <span class="product-current-price">₹${prod.price}</span>
                    <span style="font-size: 13px; color: #AAA;">/ ${prod.unit}</span>
                  </div>
                  <button class="add-cart-action-btn" onclick="manaCart.addToCart(productsData.find(p=>p.id==='${prod.id}'), 1, event)">
                    🧺 Add to Basket
                  </button>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }

      renderFarmerProfile();
      window.addEventListener("languageChanged", renderFarmerProfile);
    });
  </script>
</body>
</html>
